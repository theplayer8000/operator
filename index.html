<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F131A" />
    <title>Operator — Personal OS</title>

    <!--
      Installable as a home-screen app. HTTPS is necessary but not sufficient:
      without these, iOS opens an "installed" app inside Safari's chrome, which
      is just a bookmark. `apple-mobile-web-app-capable` is the one that makes
      it launch standalone — iOS still reads it, and does not read the manifest
      for that.

      The status bar is `black`, NOT `black-translucent`. Translucent runs the
      page under the status bar and hands you the insets to deal with, which
      only works for a layout built edge-to-edge. Operator is not: the sidebar
      drawer, the topbar and the command palette are all fixed or sticky, and a
      `padding-top` on `body` cannot reach a fixed element — it positions
      against the viewport. Translucent put the clock on top of the sidebar
      header. `black` reserves the bar and every overlay lands where it does in
      Safari.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Operator" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-base-900 text-ink-100 font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
